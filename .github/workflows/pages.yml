name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'out-of-reflection/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check puzzle rules
        run: node out-of-reflection/check-rules.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out-of-reflection
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
